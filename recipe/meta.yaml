{% set name = "pyzotero" %}
{% set version = "1.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3477de592b1e3180c044ffaa8696b4970efd462f3392285a8d2d13d7c456b4b1

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - uv-build >=0.8.14
  run:
    - bibtexparser >=2.1.0
    - click >=8.0.0
    - feedparser >=6.0.12
    - httpx2 >=2.12.0
    - python >={{ python_min }}
    - whenever >=0.10.0
    - pylatexenc >=2.10
test:
  requires:
    - python {{ python_min }}
  imports:
    - pyzotero.zotero

about:
  home: https://github.com/urschrei/pyzotero
  license: BlueOak-1.0.0
  license_file: LICENSE.md
  summary: Python wrapper for the Zotero API
  doc_url: http://pyzotero.readthedocs.org
  dev_url: https://github.com/urschrei/pyzotero

extra:
  recipe-maintainers:
    - moorepants
    - urschrei
